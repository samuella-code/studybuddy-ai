services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: studybuddy
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: studybuddy
    ports:
      - "5432:5432"
    volumes:
      - studybuddy_postgres:/var/lib/postgresql/data

volumes:
  studybuddy_postgres:
